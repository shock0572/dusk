[package]
name = "dusk"
version = "1.0.9"
edition = "2024"
rust-version = "1.98.1"
description = "DUSK - Disk Usage Survey Kit. An interactive TUI disk usage analyzer."
license = "MIT"

[[bin]]
name = "dusk"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
rayon = "1.12.0"
humansize = "2.1.3"
anyhow = "1.0.104"

[profile.release]
opt-level = 3
lto = true
